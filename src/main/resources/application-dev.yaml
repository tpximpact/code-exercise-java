spring:
  datasource:
    # Use 'file:' prefix. The path can be absolute or relative (./data/url_db)
    url: jdbc:h2:file:./data/shortener_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

    hikari:
      pool-name: URL-Shortener-Pool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  # Enable H2 Console to view your files in the browser
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates tables based on your Entities
    show-sql: true