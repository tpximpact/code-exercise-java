spring.application.name=url-shortener

# Redirect Web App settings
redirect.url.host=localhost
redirect.url.port=8080
redirect.url.length=6

# Cors settings
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Database
# Connection string and credentials
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.jpa.defer-datasource-initialization=true

# Enable the H2 web console browser interface
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true